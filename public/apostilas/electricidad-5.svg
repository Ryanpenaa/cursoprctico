<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><rect width="800" height="1120" fill="#f7f9fc"/><rect x="0" y="0" width="800" height="185" fill="#102c4a"/><path d="M0 171H800" stroke="#f6c52a" stroke-width="14"/><rect x="54" y="36" width="126" height="29" rx="14" fill="#f6c52a"/><text x="117" y="56" font-family="Arial,sans-serif" text-anchor="middle" font-size="14" font-weight="900" fill="#153653">GUÍA 05</text><text x="54" y="112" font-family="Arial,sans-serif" font-weight="900" font-size="42" fill="#fff">Tablero de Distribución</text><text x="54" y="151" font-family="Arial,sans-serif" font-size="20" fill="#ffda68">Protecciones y organización</text><g font-family="Arial,sans-serif"><text x="54" y="228" font-size="24" font-weight="900" fill="#173658">¿Qué aprenderás?</text><foreignObject x="54" y="243" width="685" height="65"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.42 Arial,sans-serif;color:#475d72">El tablero distribuye circuitos y alberga dispositivos de protección. La selección de componentes depende del diseño y de la normativa vigente.</div></foreignObject><rect x="54" y="325" width="428" height="365" rx="18" fill="#e9f0f6"/><text x="80" y="362" font-size="21" font-weight="900" fill="#1b3b5d">ILUSTRACIÓN EXPLICATIVA</text><rect x="165" y="330" width="220" height="265" rx="18" fill="#dfe8ef" stroke="#173b60" stroke-width="10"/><rect x="188" y="355" width="174" height="215" rx="8" fill="#fff"/><rect x="202" y="373" width="54" height="145" rx="7" fill="#233f60"/><rect x="270" y="373" width="74" height="145" rx="7" fill="#294c72"/><rect x="212" y="412" width="34" height="56" rx="5" fill="#f5c633"/><rect x="282" y="411" width="50" height="55" rx="5" fill="#f5c633"/><text x="270" y="641" text-anchor="middle" font-size="19" fill="#294461">Protecciones eléctricas</text><rect x="499" y="326" width="243" height="364" rx="18" fill="#fff" stroke="#d6e1ea"/><rect x="499" y="326" width="243" height="55" rx="18" fi