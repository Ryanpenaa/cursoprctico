<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1120"><rect width="800" height="1120" fill="#f8fafc"/><path d="M0 0H800V175H0Z" fill="#102c4a"/><path d="M0 169H800" stroke="#ffcb31" stroke-width="12"/><g font-family="Arial,sans-serif"><rect x="48" y="25" width="125" height="30" rx="15" fill="#ffcb31"/><text x="110" y="46" text-anchor="middle" font-size="16" font-weight="bold" fill="#142e4b">GUÍA 07</text><text x="48" y="108" font-size="53" font-weight="bold" fill="white">Seguridad Eléctrica</text><text x="48" y="147" font-size="22" fill="#ffdb78">Prevención de accidentes en el hogar</text><text x="48" y="238" font-size="29" font-weight="bold" fill="#122f50">¿Por qué es importante?</text><text x="48" y="281" font-size="21" fill="#3e556d">La prevención reduce el riesgo de choques,</text><text x="48" y="312" font-size="21" fill="#3e556d">incendios y daños en las instalaciones.</text><rect x="45" y="353" width="710" height="350" rx="24" fill="#eaf1f8"/><path d="M405 389L554 655H256Z" fill="#f7cb31" stroke="#153854" stroke-width="14" stroke-linejoin="round"/><path d="M428 438L369 536H414L389 612L472 503H420L453 438Z" fill="#143956"/><text x="400" y="681" text-anchor="middle" font-size="20" font-weight="bold" fill="#254662">PELIGRO ELÉCTRICO</text><rect x="45" y="735" width="710" height="247" rx="20" fill="white" stroke="#bfd1df"/><text x="70" y="783" font-size="29" font-weight="bold" fill="#133555">Buenas prácticas</text><g font-size="21" fill="#304960"><text x="75" y="831">✓ Reconoce señales y zonas de riesgo.</text><text x="75" y="876">✓ Mantén el agua lejos de equipos eléctricos.</text><text x="75" y="921">✓ Evita cables dañados y tomas sobrecargadas.</text><text x="75" y="966">✓ Solicita intervención de personal calificado.</text></g><rect x="45" y="1010" width="710" height="66" rx="13" fill="#ffedbd"/><text x="69" y="1040" font-size="20" font-weight="bold" fill="#815300">¡ATENCIÓN!</text><text x="69" y="1063" font-size="16" fill="#70531f">No manipules instalaciones energizadas.</text><text x="48" y="1105" font-size="15" fill="#6d8196">Electricidad Residencial desde Cero · Material demostrativo</text><text x="752" y="1105" text-anchor="end" font-size="15" font-weight="bold" fill="#163a5b">07 de 07</text></g></svg>