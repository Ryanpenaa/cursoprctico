<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><rect width="800" height="1120" fill="#f7f9fc"/><rect x="0" y="0" width="800" height="185" fill="#102c4a"/><path d="M0 171H800" stroke="#f6c52a" stroke-width="14"/><rect x="54" y="36" width="126" height="29" rx="14" fill="#f6c52a"/><text x="117" y="56" font-family="Arial,sans-serif" text-anchor="middle" font-size="14" font-weight="900" fill="#153653">GUÍA 01</text><text x="54" y="112" font-family="Arial,sans-serif" font-weight="900" font-size="42" fill="#fff">Fundamentos de Electricidad</text><text x="54" y="151" font-family="Arial,sans-serif" font-size="20" fill="#ffda68">Conceptos esenciales para comenzar</text><g font-family="Arial,sans-serif"><text x="54" y="228" font-size="24" font-weight="900" fill="#173658">¿Qué aprenderás?</text><foreignObject x="54" y="243" width="685" height="65"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.42 Arial,sans-serif;color:#475d72">La corriente eléctrica es el movimiento de cargas a través de un circuito. Aprende las magnitudes principales antes de estudiar instalaciones.</div></foreignObject><rect x="54" y="325" width="428" height="365" rx="18" fill="#e9f0f6"/><text x="80" y="362" font-size="21" font-weight="900" fill="#1b3b5d">ILUSTRACIÓN EXPLICATIVA</text><circle cx="270" cy="420" r="112" fill="#fff2bb" stroke="#ecb81f" stroke-width="6"/><text x="270" y="408" text-anchor="middle" font-size="57" font-weight="900" fill="#152d4b">V · A · Ω</text><text x="270" y="446" text-anchor="middle" font-size="21" fill="#43566e">Magnitudes eléctricas</text><path d="M125 590H420" stroke="#1a3b60" stroke-width="10" stroke-linecap="round"/><circle cx="170" cy="590" r="17" fill="#f4bf25"/><circle cx="373" cy="590" r="17" fill="#f4bf25"/><text x="270" y="644" text-anchor="middle" font-size="20" fill="#354e66">Conceptos fundamentales</text><rect x="499" y="326" width="243" height="364" rx="18" fill="#fff" stroke="#d6e1ea"/><rect x="499" y="326"