<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><rect width="800" height="1120" fill="#f7f9fc"/><rect x="0" y="0" width="800" height="185" fill="#102c4a"/><path d="M0 171H800" stroke="#f6c52a" stroke-width="14"/><rect x="54" y="36" width="126" height="29" rx="14" fill="#f6c52a"/><text x="117" y="56" font-family="Arial,sans-serif" text-anchor="middle" font-size="14" font-weight="900" fill="#153653">GUÍA 06</text><text x="54" y="112" font-family="Arial,sans-serif" font-weight="900" font-size="42" fill="#fff">Uso del Multímetro</text><text x="54" y="151" font-family="Arial,sans-serif" font-size="20" fill="#ffda68">Medición y lectura de instrumentos</text><g font-family="Arial,sans-serif"><text x="54" y="228" font-size="24" font-weight="900" fill="#173658">¿Qué aprenderás?</text><foreignObject x="54" y="243" width="685" height="65"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.42 Arial,sans-serif;color:#475d72">El multímetro permite medir magnitudes eléctricas. Es importante comprender sus escalas, símbolos, clasificación de seguridad y límites.</div></foreignObject><rect x="54" y="325" width="428" height="365" rx="18" fill="#e9f0f6"/><text x="80" y="362" font-size="21" font-weight="900" fill="#1b3b5d">ILUSTRACIÓN EXPLICATIVA</text><rect x="181" y="321" width="190" height="300" rx="27" fill="#f6c326" stroke="#183959" stroke-width="10"/><rect x="213" y="358" width="125" height="67" rx="9" fill="#dbead9" stroke="#244c68" stroke-width="5"/><text x="274" y="402" font-size="31" text-anchor="middle" font-weight="900" fill="#183959">0.00</text><circle cx="275" cy="499" r="57" fill="#253e58" stroke="#fff3b8" stroke-width="8"/><path d="M275 499L308 463" stroke="#ffd650" stroke-width="8"/><circle cx="244" cy="585" r="10" fill="#163956"/><circle cx="308" cy="585" r="10" fill="#163956"/><text x="270" y="664" text-anchor="middle" font-size="19" fill="#294461">Instrumento de medición</text><rect x="499" y="326" width="243" height="364" rx="18" fill="#fff" stroke="#d6e1ea"/><rect x="499" y="326" width="243" height="55" rx="18" fill="#f8c92d"/><text x="520" y="360" font-size="21" font-weight="900" fill="#183752">PASO A PASO</text><text x="510" y="410" font-size="19" fill="#233e58"><tspan x="510" font-weight="900" fill="#cf9900">01.</tspan><tspan x="510" dy="25">Aprende a leer los símbolos.</tspan></text><text x="510" y="491" font-size="19" fill="#233e58"><tspan x="510" font-weight="900" fill="#cf9900">02.</tspan><tspan x="510" dy="25">Estudia el manual del instrumen…</tspan></text><text x="510" y="572" font-size="19" fill="#233e58"><tspan x="510" font-weight="900" fill="#cf9900">03.</tspan><tspan x="510" dy="25">Identifica los límites nominale…</tspan></text><text x="54" y="716" font-size="24" font-weight="900" fill="#173658">Conceptos clave</text><rect x="58" y="735" width="684" height="65" rx="10" fill="#ffffff" stroke="#d9e2eb"/><circle cx="88" cy="767" r="15" fill="#f2c32a"/><text x="88" y="773" text-anchor="middle" font-size="17" font-weight="800" fill="#183955">1</text><text x="120" y="758" font-size="21" font-weight="800" fill="#173454">V</text><text x="120" y="784" font-size="17" fill="#55687c">Medición de voltaje.</text><rect x="58" y="811" width="684" height="65" rx="10" fill="#f3f6fa" stroke="#d9e2eb"/><circle cx="88" cy="843" r="15" fill="#f2c32a"/><text x="88" y="849" text-anchor="middle" font-size="17" font-weight="800" fill="#183955">2</text><text x="120" y="834" font-size="21" font-weight="800" fill="#173454">Ω</text><text x="120" y="860" font-size="17" fill="#55687c">Medición de resistencia.</text><rect x="58" y="887" width="684" height="65" rx="10" fill="#ffffff" stroke="#d9e2eb"/><circle cx="88" cy="919" r="15" fill="#f2c32a"/><text x="88" y="925" text-anchor="middle" font-size="17" font-weight="800" fill="#183955">3</text><text x="120" y="910" font-size="21" font-weight="800" fill="#173454">CAT</text><text x="120" y="936" font-size="17" fill="#55687c">Categoría de seguridad del equipo.</text><rect x="54" y="978" width="688" height="98" rx="16" fill="#fff1c6" stroke="#eec743"/><path d="M84 1003L105 1042H63Z" stroke="#a27800" stroke-width="4" fill="#ffd14b"/><text x="84" y="1030" text-anchor="middle" font-size="23" font-weight="900" fill="#785700">!</text><text x="126" y="1006" font-size="19" font-weight="900" fill="#6e5305">SEGURIDAD IMPORTANTE</text><foreignObject x="126" y="1015" width="593" height="55"><div xmlns="http://www.w3.org/1999/xhtml" style="font:16px/1.35 Arial,sans-serif;color:#614e26">No realices mediciones en circuitos energizados sin formación y equipo apropiados.</div></foreignObject><text x="54" y="1100" font-size="13" fill="#8695a6">ELECTRICIDAD RESIDENCIAL DESDE CERO · MATERIAL DEMOSTRATIVO</text><text x="742" y="1100" text-anchor="end" font-size="15" font-weight="900" fill="#1c4166">06</text></g></svg>