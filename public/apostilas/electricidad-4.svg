<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><rect width="800" height="1120" fill="#f7f9fc"/><rect x="0" y="0" width="800" height="185" fill="#102c4a"/><path d="M0 171H800" stroke="#f6c52a" stroke-width="14"/><rect x="54" y="36" width="126" height="29" rx="14" fill="#f6c52a"/><text x="117" y="56" font-family="Arial,sans-serif" text-anchor="middle" font-size="14" font-weight="900" fill="#153653">GUÍA 04</text><text x="54" y="112" font-family="Arial,sans-serif" font-weight="900" font-size="42" fill="#fff">Interruptores y Luz</text><text x="54" y="151" font-family="Arial,sans-serif" font-size="20" fill="#ffda68">Comprende el control de iluminación</text><g font-family="Arial,sans-serif"><text x="54" y="228" font-size="24" font-weight="900" fill="#173658">¿Qué aprenderás?</text><foreignObject x="54" y="243" width="685" height="65"><div xmlns="http://www.w3.org/1999/xhtml" style="font:19px/1.42 Arial,sans-serif;color:#475d72">El interruptor es un dispositivo de maniobra que permite abrir o cerrar un circuito de iluminación. Su representación en planos es esencial.</div></foreignObject><rect x="54" y="325" width="428" height="365" rx="18" fill="#e9f0f6"/><text x="80" y="362" font-size="21" font-weight="900" fill="#1b3b5d">ILUSTRACIÓN EXPLICATIVA</text><circle cx="270" cy="435" r="102" fill="#fff3b9" stroke="#efb91d" stroke-width="7"/><path d="M215 417Q270 363 325 417L307 470H233Z" fill="#fff" stroke="#163b60" stroke-width="8"/><path d="M236 469H304M245 491H294M260 510H280" stroke="#163b60" stroke-width="9" stroke-linecap="round"/><path d="M125 575H231M306 575H414" stroke="#163b60" stroke-width="9"/><circle cx="230" cy="575" r="12" fill="#f1bf22"/><circle cx="305" cy="575" r="12" fill="#f1bf22"/><text x="270" y="641" text-anchor="middle" font-size="19" fill="#294461">Control de iluminación</text><rect x="499" y="326" width="243" height="364" rx="18" fill="#fff" stroke="#d6e1ea"/><rect x="499" y="326" width="243" height="55" rx="18" fill="#f8c92d"/><text x="520" y="360" font-size="21" font-weight="900" fill="#183752">PASO A PASO</text><text x="510" y="410" font-size="19" fill="#233e58"><tspan x="510" font-weight="900" fill="#cf9900">01.</tspan><tspan x="510" dy="25">Reconoce el símbolo del interru…</tspan></text><text x="510" y="491" font-size="19" fill="#233e58"><tspan x="510" font-weight="900" fill="#cf9900">02.</tspan><tspan x="510" dy="25">Ubica la luminaria en el plano.</tspan></text><text x="510" y="572" font-size="19" fill="#233e58"><tspan x="510" font-weight="900" fill="#cf9900">03.</tspan><tspan x="510" dy="25">Interpreta el estado abierto/ce…</tspan></text><text x="54" y="716" font-size="24" font-weight="900" fill="#173658">Conceptos clave</text><rect x="58" y="735" width="684" height="65" rx="10" fill="#ffffff" stroke="#d9e2eb"/><circle cx="88" cy="767" r="15" fill="#f2c32a"/><text x="88" y="773" text-anchor="middle" font-size="17" font-weight="800" fill="#183955">1</text><text x="120" y="758" font-size="21" font-weight="800" fill="#173454">Interruptor</text><text x="120" y="784" font-size="17" fill="#55687c">Controla la apertura del circuito.</text><rect x="58" y="811" width="684" height="65" rx="10" fill="#f3f6fa" stroke="#d9e2eb"/><circle cx="88" cy="843" r="15" fill="#f2c32a"/><text x="88" y="849" text-anchor="middle" font-size="17" font-weight="800" fill="#183955">2</text><text x="120" y="834" font-size="21" font-weight="800" fill="#173454">Luminaria</text><text x="120" y="860" font-size="17" fill="#55687c">Transforma energía en luz.</text><rect x="58" y="887" width="684" height="65" rx="10" fill="#ffffff" stroke="#d9e2eb"/><circle cx="88" cy="919" r="15" fill="#f2c32a"/><text x="88" y="925" text-anchor="middle" font-size="17" font-weight="800" fill="#183955">3</text><text x="120" y="910" font-size="21" font-weight="800" fill="#173454">Símbolos</text><text x="120" y="936" font-size="17" fill="#55687c">Representan partes del sistema.</text><rect x="54" y="978" width="688" height="98" rx="16" fill="#fff1c6" stroke="#eec743"/><path d="M84 1003L105 1042H63Z" stroke="#a27800" stroke-width="4" fill="#ffd14b"/><text x="84" y="1030" text-anchor="middle" font-size="23" font-weight="900" fill="#785700">!</text><text x="126" y="1006" font-size="19" font-weight="900" fill="#6e5305">SEGURIDAD IMPORTANTE</text><foreignObject x="126" y="1015" width="593" height="55"><div xmlns="http://www.w3.org/1999/xhtml" style="font:16px/1.35 Arial,sans-serif;color:#614e26">Este ejemplo es conceptual y no sustituye un proyecto eléctrico aprobado.</div></foreignObject><text x="54" y="1100" font-size="13" fill="#8695a6">ELECTRICIDAD RESIDENCIAL DESDE CERO · MATERIAL DEMOSTRATIVO</text><text x="742" y="1100" text-anchor="end" font-size="15" font-weight="900" fill="#1c4166">04</text></g></svg>